# Fragmento para el server {} del API: el que tiene `location /GUI` y `location /chatbot`
# (hoy /etc/nginx/sites-available/chatbot, puerto 80). Va dentro de ese server {}, junto a /chatbot.
# El TLS lo termina el balanceador delante de la EC2; nginx no escucha en 443.
#
# Arriba del mismo archivo, fuera del server {} (sites-enabled se incluye dentro de http {}):
# zona de rate limit por IP para el agente publico.
#   limit_req_zone $binary_remote_addr zone=agents:10m rate=30r/m;
#
# Dentro del server {}, antes de los location: IP real del visitante en $remote_addr (si no, es la
# del balanceador y el limit_req y los topes por IP cuentan a todos como uno solo).
#   set_real_ip_from 172.31.0.0/16;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;

location /agents/ {
    limit_req zone=agents burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se sobrescribe, no se agrega ($proxy_add_x_forwarded_for): el servicio toma la primera IP
    # de X-Forwarded-For para los topes por IP (TRUST_PROXY=1) y el visitante no debe poder inventarla.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # streaming de ChatKit (text/event-stream)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    chunked_transfer_encoding on;
}

# Webhook de Telegram (F2). Llega desde las pocas IPs de Telegram, asi que no entra al limit_req por IP
# (30 r/m se agotarian entre todos los chats del bot y Telegram reintentaria con espera). Lo protege el
# secreto X-Telegram-Bot-Api-Secret-Token que valida el servicio (403 si no coincide).
# `location =` gana sobre `location /agents/`.
location = /agents/sales/telegram {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
