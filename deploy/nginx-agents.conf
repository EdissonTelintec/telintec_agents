# Fragmento para el server {} de appinterna.telintec.mx (nginx del API).
# Arriba, en el bloque http {}: zona de rate limit por IP para el agente publico.
#   limit_req_zone $binary_remote_addr zone=agents:10m rate=30r/m;

location /agents/ {
    limit_req zone=agents burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # streaming de ChatKit (text/event-stream)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    chunked_transfer_encoding on;
}
